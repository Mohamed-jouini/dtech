services:
  maktaba-qanouniya:
    build: .
    container_name: maktaba-qanouniya
    restart: unless-stopped
    ports:
      - "127.0.0.1:5006:5006"
    volumes:
      - /srv/clients/mwj/data:/data
    environment:
      - DB_PATH=/data/maktaba.db
      - UPLOAD_DIR=/data/uploads
      - NEXTCLOUD_URL=http://cabinet.mwj-lawyers.com
      - BASE_PATH=/maktaba-qanouniya
      - OCR_LANG=ara
      - AUDIT_URL=http://audit-app:5010/api/log
      - PORT=5006
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
